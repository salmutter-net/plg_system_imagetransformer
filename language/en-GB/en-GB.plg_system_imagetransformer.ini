; Image Transformer plugin - English (en-GB)
PLG_SYSTEM_IMAGETRANSFORMER_FIELDSET_BASIC="Basic settings"
PLG_SYSTEM_IMAGETRANSFORMER_FIELDSET_CONTENT="Article Images"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_SIGNKEY_LABEL="Signkey (min 256 Bit)"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_SIGNKEY_DESC="Secret key used to sign transformation URLs. Required, at least 32 characters."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_IMAGEFOLDER_LABEL="Image Folder (Media root)"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_IMAGEFOLDER_DESC="The folder where the images are stored."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CACHEFOLDER_LABEL="Image Cache Folder"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CACHEFOLDER_DESC="The folder where the rendered images are cached."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_FETCHMISSING_LABEL="Fetch missing images from LIVE"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_FETCHMISSING_DESC="If an image is missing locally, the plugin can try to download it from a LIVE site (DEV/local convenience)."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_LIVEBASEURL_LABEL="LIVE Base URL"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_LIVEBASEURL_DESC="Base URL of the LIVE site, e.g. https://example.com (used only when fetching missing images is enabled)."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTIMAGES_LABEL="Transform article images"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTIMAGES_DESC="Rewrites local &lt;img&gt; tags found in article, category, featured and custom-module texts so they are served through the Glide transformer. Adds a responsive srcset, the sizes attribute and lazy loading automatically. External images, data URIs, already transformed URLs and images with the class 'no-transform' are left untouched."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTWIDTHS_LABEL="srcset widths"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTWIDTHS_DESC="Comma-separated pixel widths generated for the srcset of each article image. The smallest width is also used for the src fallback. Example: 480,768,1200,1600 produces /img/photo.jpg?w=480 ... ?w=1600 entries."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTSIZES_LABEL="sizes attribute"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTSIZES_DESC="Value of the sizes attribute telling the browser which srcset width to pick. Use 'auto' if all transformed images get loading=lazy (default), or a classic media-condition list like '(min-width: 1200px) 1140px, (min-width: 768px) 720px, 100vw'."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFIT_LABEL="Default fit"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFIT_DESC="Glide fit mode used for article images without a size definition. 'max' scales down within the given width keeping the aspect ratio (recommended for srcset). Other modes crop, stretch or fill the canvas."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFIT_MAX="max (keep aspect ratio)"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTQUALITY_LABEL="Quality"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTQUALITY_DESC="JPEG/WebP/AVIF quality (1-100) for transformed article images. 75 is a good default; lower values produce smaller files."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFORMAT_LABEL="Output format"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFORMAT_DESC="Force an output format for article images (fm parameter). Requires server support — check whether GD or Imagick can encode WebP/AVIF. Leave on 'Original format' to keep the source format."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFORMAT_ORIGINAL="Original format"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFORMAT_PJPG="Progressive JPEG"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTSIZEDEF_LABEL="Size definitions"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTSIZEDEF_DESC="Fixed transformations for images carrying a specific CSS class — one definition per line: classname: param=value,param=value. Example: team-photo: w=400,h=533,fit=crop,q=80. Matching images get a single transformed URL (no srcset). Add the class 'no-transform' to exclude an image entirely."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTLAZY_LABEL="Lazy loading"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTLAZY_DESC="Adds loading=&quot;lazy&quot; to transformed article images that do not already define a loading attribute. Required for sizes=&quot;auto&quot;; images with an explicit loading attribute (e.g. 'eager') are kept as-is."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTEXCLARTICLES_LABEL="Exclude articles"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTEXCLARTICLES_DESC="Comma-separated article IDs whose images are not transformed — neither text images nor intro/fulltext images. Example: 12,45,78."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTEXCLCATEGORIES_LABEL="Exclude categories"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTEXCLCATEGORIES_DESC="Comma-separated category IDs whose article images are not transformed (applies to the article's catid). Example: 9,17."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTDIMENSIONS_LABEL="Set width/height attributes"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTDIMENSIONS_DESC="Fills in missing width/height attributes from the local image's intrinsic size to prevent layout shift (CLS). Existing attributes are kept unchanged — they only define the aspect ratio, CSS controls the displayed size. If only one attribute exists, the other is calculated proportionally."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTINTROPARAMS_LABEL="Intro image params"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTINTROPARAMS_DESC="Glide params applied to the article's intro image (image_intro) in the 'Images and Links' tab. Syntax: param=value,param=value, e.g. w=800,h=450,fit=crop,q=80. The original path stays available to layouts as _image_intro. Leave empty to keep the intro image untransformed."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFULLTEXTPARAMS_LABEL="Fulltext image params"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFULLTEXTPARAMS_DESC="Glide params applied to the article's full-text image (image_fulltext) in the 'Images and Links' tab. Syntax: param=value,param=value, e.g. w=1200,h=675,fit=crop,q=80. The original path stays available to layouts as _image_fulltext. Leave empty to keep the fulltext image untransformed."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTCONTEXTS_LABEL="Allowed contexts"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTCONTEXTS_DESC="Content contexts whose texts get transformed — one per line, trailing '*' works as a wildcard. Defaults cover articles, categories, featured views, tag pages, contacts and custom HTML modules. Example: com_content.* or mod_custom.content."
