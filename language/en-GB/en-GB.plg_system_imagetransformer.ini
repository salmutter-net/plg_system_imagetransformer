PLG_SYSTEM_IMAGETRANSFORMER_FIELDSET_CONTENT="Article Images"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_SIGNKEY_LABEL="Signkey (min 256 Bit)"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_SIGNKEY_DESC="Secret key used to sign transformation URLs. Required, at least 32 characters."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_IMAGEFOLDER_LABEL="Image Folder (Media root)"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_IMAGEFOLDER_DESC="The folder where the images are stored."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CACHEFOLDER_LABEL="Image Cache Folder"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CACHEFOLDER_DESC="The folder where the rendered images are cached."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_FETCHMISSING_LABEL="Fetch missing images from LIVE"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_FETCHMISSING_DESC="If an image is missing locally, the plugin can try to download it from a LIVE site (DEV/local convenience)."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_LIVEBASEURL_LABEL="LIVE Base URL"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_LIVEBASEURL_DESC="Base URL of the LIVE site, e.g. https://example.com (used only when fetching missing images is enabled)."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTIMAGES_LABEL="Transform article images"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTIMAGES_DESC="Rewrite &lt;img&gt; tags in com_content article/category/featured texts (and mod_custom) through the transformer. Adds srcset and lazy loading."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTWIDTHS_LABEL="srcset widths"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTWIDTHS_DESC="Comma-separated pixel widths generated for the srcset of each article image. The first width is also used for src."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTSIZES_LABEL="sizes attribute"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTSIZES_DESC="Value of the sizes attribute, e.g. auto or (min-width: 1200px) 1140px, 100vw."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFIT_LABEL="Default fit"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFIT_DESC="Glide fit mode used for article images without a size definition."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFIT_MAX="max (keep aspect ratio)"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTQUALITY_LABEL="Quality"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTQUALITY_DESC="JPEG/WebP quality for transformed article images."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFORMAT_LABEL="Output format"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFORMAT_DESC="Force an output format for article images. Requires the server to support it (GD/Imagick)."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFORMAT_ORIGINAL="Original format"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFORMAT_PJPG="Progressive JPEG"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTSIZEDEF_LABEL="Size definitions"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTSIZEDEF_DESC="One per line: classname: w=700,h=400,fit=crop,q=80. Images whose class matches get these Glide params (no srcset). Add class 'no-transform' to skip an image."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTLAZY_LABEL="Lazy loading"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTLAZY_DESC="Add loading=&quot;lazy&quot; to transformed article images that do not define a loading attribute. Required for sizes=&quot;auto&quot;."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTEXCLARTICLES_LABEL="Exclude articles"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTEXCLARTICLES_DESC="Comma-separated article IDs whose images are not transformed."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTEXCLCATEGORIES_LABEL="Exclude categories"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTEXCLCATEGORIES_DESC="Comma-separated category IDs whose article images are not transformed."
