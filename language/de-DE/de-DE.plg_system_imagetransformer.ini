; Image Transformer Plugin - Deutsch (de-DE)
PLG_SYSTEM_IMAGETRANSFORMER_FIELDSET_BASIC="Grundeinstellungen"
PLG_SYSTEM_IMAGETRANSFORMER_FIELDSET_CONTENT="Beitragsbilder"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_SIGNKEY_LABEL="Signkey (min. 256 Bit)"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_SIGNKEY_DESC="Geheimer Schlüssel zum Signieren der Transformations-URLs. Erforderlich, mindestens 32 Zeichen."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_IMAGEFOLDER_LABEL="Bilderordner (Media-Root)"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_IMAGEFOLDER_DESC="Der Ordner, in dem die Bilder gespeichert sind."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CACHEFOLDER_LABEL="Cache-Ordner für Bilder"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CACHEFOLDER_DESC="Der Ordner, in dem die gerenderten Bilder zwischengespeichert werden."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_FETCHMISSING_LABEL="Fehlende Bilder von LIVE laden"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_FETCHMISSING_DESC="Fehlt ein Bild lokal, kann das Plugin es von der LIVE-Site laden (Komfort für DEV/lokal)."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_LIVEBASEURL_LABEL="LIVE Base-URL"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_LIVEBASEURL_DESC="Basis-URL der LIVE-Site, z. B. https://example.com (nur verwendet, wenn das Nachladen aktiviert ist)."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTIMAGES_LABEL="Beitragsbilder transformieren"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTIMAGES_DESC="Schreibt lokale &lt;img&gt;-Tags in Beitrags-, Kategorie-, Featured- und Custom-Modul-Texten so um, dass sie über den Glide-Transformer ausgeliefert werden. Fügt automatisch ein responsives srcset, das sizes-Attribut und Lazy Loading hinzu. Externe Bilder, Data-URIs, bereits transformierte URLs und Bilder mit der Klasse 'no-transform' bleiben unverändert."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTWIDTHS_LABEL="srcset-Breiten"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTWIDTHS_DESC="Kommagetrennte Pixelbreiten, die für das srcset jedes Beitragsbildes erzeugt werden. Die kleinste Breite wird auch für das src-Fallback verwendet. Beispiel: 480,768,1200,1600 erzeugt /img/foto.jpg?w=480 ... ?w=1600 Einträge."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTSIZES_LABEL="sizes-Attribut"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTSIZES_DESC="Wert des sizes-Attributs, der dem Browser sagt, welche srcset-Breite gewählt werden soll. 'auto' verwenden, wenn alle transformierten Bilder loading=lazy erhalten (Standard), oder eine klassische Media-Condition-Liste wie '(min-width: 1200px) 1140px, (min-width: 768px) 720px, 100vw'."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFIT_LABEL="Standard-Fit"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFIT_DESC="Glide-Fit-Modus für Beitragsbilder ohne Größendefinition. 'max' skaliert innerhalb der angegebenen Breite unter Beibehaltung des Seitenverhältnisses (empfohlen für srcset). Andere Modi schneiden zu, strecken oder füllen die Fläche."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFIT_MAX="max (Seitenverhältnis beibehalten)"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTQUALITY_LABEL="Qualität"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTQUALITY_DESC="JPEG-/WebP-/AVIF-Qualität (1-100) der transformierten Beitragsbilder. 75 ist ein guter Standard; niedrigere Werte erzeugen kleinere Dateien."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFORMAT_LABEL="Ausgabeformat"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFORMAT_DESC="Erzwingt ein Ausgabeformat für Beitragsbilder (fm-Parameter). Der Server muss es unterstützen — prüfen, ob GD oder Imagick WebP/AVIF kodieren kann. Bei 'Originalformat' bleibt das Quellformat erhalten."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFORMAT_ORIGINAL="Originalformat"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFORMAT_PJPG="Progressives JPEG"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTSIZEDEF_LABEL="Größendefinitionen"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTSIZEDEF_DESC="Feste Transformationen für Bilder mit einer bestimmten CSS-Klasse — eine Definition pro Zeile: klassenname: parameter=wert,parameter=wert. Beispiel: team-photo: w=400,h=533,fit=crop,q=80. Passende Bilder erhalten eine einzelne transformierte URL (kein srcset). Die Klasse 'no-transform' schließt ein Bild komplett aus."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTLAZY_LABEL="Lazy Loading"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTLAZY_DESC="Fügt loading=&quot;lazy&quot; zu transformierten Beitragsbildern hinzu, die noch kein loading-Attribut haben. Erforderlich für sizes=&quot;auto&quot;; Bilder mit explizitem loading-Attribut (z. B. 'eager') bleiben unverändert."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTEXCLARTICLES_LABEL="Beiträge ausschließen"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTEXCLARTICLES_DESC="Kommagetrennte Beitrags-IDs, deren Bilder nicht transformiert werden — weder Textbilder noch Einleitungs-/Volltextbilder. Beispiel: 12,45,78."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTEXCLCATEGORIES_LABEL="Kategorien ausschließen"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTEXCLCATEGORIES_DESC="Kommagetrennte Kategorie-IDs, deren Beitragsbilder nicht transformiert werden (gilt für die catid des Beitrags). Beispiel: 9,17."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTDIMENSIONS_LABEL="width/height-Attribute setzen"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTDIMENSIONS_DESC="Ergänzt fehlende width/height-Attribute aus der tatsächlichen Bildgröße, um Layoutverschiebungen (CLS) zu verhindern. Vorhandene Attribute bleiben unverändert — sie definieren nur das Seitenverhältnis, die Anzeigegröße steuert CSS. Fehlt nur ein Attribut, wird das andere proportional berechnet."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTINTROPARAMS_LABEL="Einleitungsbild-Parameter"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTINTROPARAMS_DESC="Glide-Parameter für das Einleitungsbild (image_intro) im Tab 'Bilder und Links'. Syntax: parameter=wert,parameter=wert, z. B. w=800,h=450,fit=crop,q=80. Der Originalpfad bleibt für Layouts als _image_intro verfügbar. Leer lassen, um das Einleitungsbild unverändert zu lassen."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFULLTEXTPARAMS_LABEL="Volltextbild-Parameter"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTFULLTEXTPARAMS_DESC="Glide-Parameter für das Volltextbild (image_fulltext) im Tab 'Bilder und Links'. Syntax: parameter=wert,parameter=wert, z. B. w=1200,h=675,fit=crop,q=80. Der Originalpfad bleibt für Layouts als _image_fulltext verfügbar. Leer lassen, um das Volltextbild unverändert zu lassen."
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTCONTEXTS_LABEL="Erlaubte Kontexte"
PLG_SYSTEM_IMAGETRANSFORMER_FIELD_CONTENTCONTEXTS_DESC="Content-Kontexte, deren Texte transformiert werden — einer pro Zeile, ein angehängtes '*' wirkt als Wildcard. Die Vorgaben decken Beiträge, Kategorien, Featured-Ansichten, Tag-Seiten, Kontakte und eigene HTML-Module ab. Beispiel: com_content.* oder mod_custom.content."
